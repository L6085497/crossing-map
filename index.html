// ===== Shared reports backend =====
// BACKEND: 'ntfy' = free public relay, no account (prototype; anyone can post, kept 12h)
//          'supabase' = real database (fill SUPABASE_URL / SUPABASE_ANON_KEY, run schema.sql)
//          'local' = this browser only
const CONFIG={BACKEND:'ntfy',NTFY_TOPIC:'waycross-crossings-l6085497',
  SUPABASE_URL:'https://YOUR-PROJECT.supabase.co',SUPABASE_ANON_KEY:'YOUR-ANON-KEY'};
const KEY='crossingReports';
let shared=JSON.parse(localStorage.getItem(KEY)||'{}');
const rep=()=>shared;
function apply(id,s,t){if(!shared[id]||shared[id].t<t){shared[id]={s,t}}}
async function pull(){try{
 if(CONFIG.BACKEND==='ntfy'){const r=await fetch(`https://ntfy.sh/${CONFIG.NTFY_TOPIC}/json?poll=1&since=2h`);
  (await r.text()).split('\n').filter(Boolean).forEach(l=>{const m=JSON.parse(l);if(m.event!=='message')return;
   try{const d=JSON.parse(m.message);if(d.id&&/^(blocked|clear)$/.test(d.s))apply(d.id,d.s,m.time*1000)}catch(e){}})}
 else if(CONFIG.BACKEND==='supabase'){const since=new Date(Date.now()-2*3600e3).toISOString();
  const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/reports?select=crossing_id,status,created_at&created_at=gte.${since}&order=created_at.asc`,
   {headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+CONFIG.SUPABASE_ANON_KEY}});
  (await r.json()).forEach(x=>apply(x.crossing_id,x.status,Date.parse(x.created_at)))}
 localStorage.setItem(KEY,JSON.stringify(shared));if(typeof markers!=='undefined')Object.keys(markers).forEach(refresh);
}catch(e){console.warn('pull failed',e)}}
async function push(id,s){try{
 if(CONFIG.BACKEND==='ntfy')await fetch(`https://ntfy.sh/${CONFIG.NTFY_TOPIC}`,{method:'POST',body:JSON.stringify({id,s})});
 else if(CONFIG.BACKEND==='supabase')await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/reports`,{method:'POST',
  headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+CONFIG.SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
  body:JSON.stringify({crossing_id:id,status:s})});
}catch(e){alert('Saved on this phone, but could not share: '+e.message)}}
const map=L.map('map',{zoomControl:false}).setView([31.214,-82.355],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const markers={};
function color(id){const r=rep()[id];if(!r||Date.now()-r.t>2*3600e3)return'#6b7280';return r.s=='blocked'?'#dc2626':'#16a34a'}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m+' min ago'}
function popup(p){const r=rep()[p.crossing_id];return `<b>${p.launch_rank?'⭐ #'+p.launch_rank+' ':''}${p.street||p.highway}</b><br>
ID ${p.crossing_id} · ${p.railroad}<br>Trains/day: ${p.trains_per_day} · Cars/day (AADT): ${p.aadt}<br>${p.warning}<br>
Status: <b>${r&&Date.now()-r.t<2*3600e3?r.s+' ('+ago(r.t)+')':'no recent report'}</b><br>
<button class="b" style="background:#dc2626" onclick="report('${p.crossing_id}','blocked')">Blocked</button><button class="b" style="background:#16a34a" onclick="report('${p.crossing_id}','clear')">Clear</button>
<br><a href="${p.fra_url}" target="_blank">FRA record</a>`}
function report(id,s){apply(id,s,Date.now());localStorage.setItem(KEY,JSON.stringify(shared));push(id,s);refresh(id);markers[id].setPopupContent(popup(markers[id].p))}
function refresh(id){markers[id].setStyle({fillColor:color(id)})}
DATA.features.forEach(f=>{const p=f.properties,[lon,lat]=f.geometry.coordinates;
 const m=L.circleMarker([lat,lon],{radius:p.launch_rank?13:7,color:p.launch_rank?'#f59e0b':'#fff',weight:p.launch_rank?4:2,fillColor:color(p.crossing_id),fillOpacity:.9}).addTo(map).bindPopup(()=>popup(p));
 m.p=p;markers[p.crossing_id]=m;if(p.launch_rank)m.bindTooltip('#'+p.launch_rank,{permanent:true,direction:'top',offset:[0,-10]});});
let me;document.getElementById('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];me?me.setLatLng(ll):me=L.circleMarker(ll,{radius:8,color:'#2563eb',fillColor:'#60a5fa',fillOpacity:1}).addTo(map);map.setView(ll,15)},e=>alert('Location unavailable: '+e.message),{enableHighAccuracy:true});
pull();setInterval(pull,30000);
</script></body></html>
